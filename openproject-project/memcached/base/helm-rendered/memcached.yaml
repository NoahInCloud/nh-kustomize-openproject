---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: poc-memcached
  namespace: default
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/instance: poc-memcached
---
apiVersion: v1
kind: Service
metadata:
  name: poc-memcached
  namespace: default
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/instance: poc-memcached
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/instance: poc-memcached
  ports:
    - name: memcache
      port: 11211
      targetPort: 11211
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-memcached
  namespace: default
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/instance: poc-memcached
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached
      app.kubernetes.io/instance: poc-memcached
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memcached
        app.kubernetes.io/instance: poc-memcached
    spec:
      serviceAccountName: poc-memcached
      containers:
        - name: memcached
          image: docker.io/memcached:latest
          ports:
            - containerPort: 11211
              name: memcache
