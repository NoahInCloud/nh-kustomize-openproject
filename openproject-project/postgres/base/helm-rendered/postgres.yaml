---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: poc-postgres
  namespace: default
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: poc-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: poc-postgres
  namespace: default
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: poc-postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: poc-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: poc-postgres
  namespace: default
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: poc-postgres
spec:
  serviceName: poc-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: poc-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: poc-postgres
    spec:
      serviceAccountName: poc-postgres
      containers:
        - name: postgres
          image: docker.io/postgres:16
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: opdb
            - name: POSTGRES_USER
              value: opuser
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
