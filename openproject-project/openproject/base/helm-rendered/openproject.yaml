---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: poc-openproject
  namespace: default
  labels:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/instance: poc-openproject
---
apiVersion: v1
kind: Service
metadata:
  name: poc-openproject-web
  namespace: default
  labels:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/instance: poc-openproject
spec:
  selector:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/instance: poc-openproject
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-openproject-web
  namespace: default
  labels:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/instance: poc-openproject
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject
      app.kubernetes.io/instance: poc-openproject
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject
        app.kubernetes.io/instance: poc-openproject
    spec:
      serviceAccountName: poc-openproject
      containers:
        - name: openproject
          image: openproject/openproject:14
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgres://opuser@poc-postgres:5432/opdb"
            - name: MEMCACHE_SERVER
              value: "poc-memcached:11211"
