apiVersion: v1
kind: ServiceAccount
metadata:
  name: poc-openproject
  # Remove namespace: default to allow Kustomize to set it
---
apiVersion: v1
kind: Service
metadata:
  name: poc-openproject-web
  labels:
    app.kubernetes.io/name: openproject
spec:
  selector:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/instance: poc-openproject
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-openproject-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject
      app.kubernetes.io/instance: poc-openproject
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject
        app.kubernetes.io/instance: poc-openproject
    spec:
      serviceAccountName: poc-openproject
      containers:
        - name: openproject
          image: openproject/openproject:14
          ports:
            - name: http
              containerPort: 8080
          env:
            # Keep non-sensitive config here
            - name: MEMCACHE_SERVER
              value: "poc-memcached:11211"
            # We remove DATABASE_URL here because Vault will provide it
