apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lhw-openproject-prod

resources:
  - ../../base

labels:
  - pairs:
      environment: production

images:
  - name: openproject/openproject
    newTag: "14"

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: openproject # Added the specific name
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openproject
      spec:
        template:
          metadata:
            annotations:
              vault.hashicorp.com/agent-inject: "true"
              vault.hashicorp.com/role: "poc-role"
              vault.hashicorp.com/agent-inject-secret-db: "secret/data/poc/db"
              vault.hashicorp.com/agent-inject-template-db: |
                {{- with secret "secret/data/poc/db" -}}
                # Use the variables OpenProject expects
                export DATABASE_URL="postgresql://{{ .Data.data.username }}:{{ .Data.data.password }}@poc-postgres:5432/poc_database"
                {{- end }}
          spec:
            containers:
            - name: openproject # Ensure this matches the name in your base
              command: ["/bin/sh", "-c"]
              args:
                - |
                  if [ -f /vault/secrets/db ]; then
                    . /vault/secrets/db
                  fi
                  ./docker/prod/entrypoint.sh # Or whatever your base entrypoint is
    target:
      kind: Deployment
      name: openproject
